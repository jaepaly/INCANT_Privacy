meta:
  jurisdiction: EU
  jurisdiction_name: EU — General Data Protection Regulation (GDPR)
  version: "0.2"
  updated: "2026-08-10"
  note: |
    v0.2에서 전 조항 원문 대조 완료.

    검증 경로: EUR-Lex의 CELEX:32016R0679 전문 페이지는 본문 추출 시 recital
    구간에서 잘려 조항 본문에 도달하지 못했다. 따라서 조항 단위 대조는
    gdpr-info.eu의 조항별 페이지로 수행했다. 각 legal_basis의 source가 실제로
    확인한 URL이다.

    권위 있는 원문은 EUR-Lex(CELEX:32016R0679)이며, 인용을 공식 문서에 쓸 때는
    EUR-Lex 본문으로 다시 대조할 것.
    https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679

    교차검증: Codex CLI와 Gemini CLI로 독립 검증을 병행했다.
    GDPR 조항에 대해서는 세 판정이 모두 일치했다.

rules:
  # ────────────────────────────────────────────────────────────
  - id: EU-TRP-001
    domain: 투명성
    title: 정보주체에 대한 정보 제공 의무 미이행
    summary: 수집 시점에 제공해야 할 법정 고지 항목이 전혀 제공되지 않는다.

    legal_basis:
      - law: GDPR
        article: Art.12(1)
        note: |
          Arts.13-14의 정보를 간결·투명·이해하기 쉽고 접근 가능한 형태로,
          명확하고 평이한 언어로 제공할 의무
        verification: 확인완료
        checked_at: "2026-08-10"
        source: https://gdpr-info.eu/art-12-gdpr/
      - law: GDPR
        article: Art.13
        note: |
          'Information to be provided where personal data are collected from the
          data subject' — 컨트롤러 신원·연락처, DPO, 처리목적 및 legal basis,
          수령인 또는 수령인의 범주, 제3국 이전 및 그 근거(적정성 결정 또는
          적절한 안전조치), 보관기간 또는 산정 기준, 정보주체의 권리,
          감독기구 불만제기권 등
        verification: 확인완료
        checked_at: "2026-08-10"
        source: https://gdpr-info.eu/art-13-gdpr/
      - law: GDPR
        article: Art.13(2)(a)
        note: |
          "the period for which the personal data will be stored, or **if that is
          not possible**, the criteria used to determine that period" —
          산정 기준은 기간 제시가 불가능한 경우의 대체 수단이지 동등한 선택지가 아니다
        verification: 확인완료
        checked_at: "2026-08-11"
        source: https://gdpr-info.eu/art-13-gdpr/
      - law: WP29 Guidelines (EDPB 승인) — 법령 아님, 유권해석
        article: WP260 rev.01, Annex — Art.13.2(a)/14.2(a) 행 (p.38-39)
        note: |
          보관기간은 "정보주체가 자신의 상황에 비추어 특정 데이터·목적에 대한
          보유기간을 판단할 수 있는" 방식으로 기술되어야 하며,
          **"목적 달성에 필요한 기간 동안 보관한다"는 식의 포괄 서술은 불충분하다**
          (It is not sufficient for the data controller to generically state that
          personal data will be kept as long as necessary...).
          필요한 경우 개인정보 유형별·처리목적별로 보관기간을 구분해 기재해야 한다
        verification: 확인완료
        checked_at: "2026-08-11"
        source: https://ec.europa.eu/newsroom/article29/items/622227

    condition_human: |
      정보주체로부터 직접 개인정보를 수집하면서
      Art.13이 열거하는 고지 항목이 제공되지 않는 경우.

      보관기간 항목은 '언급의 유무'가 아니라 '판단 가능성'으로 본다 —
      "목적 달성에 필요한 기간" 수준의 포괄 문구만 있으면 미충족으로 판정한다
      (WP260 rev.01 Annex).
    check:
      scope: service
      all_of:
        - {field: privacy_notice_eu, op: is_null}

    severity_base: HIGH
    severity_rationale: |
      Art.13은 항목을 열거식으로 요구하므로 '문서가 없음'은 전 항목 결손이다.
      특히 수령인 범주와 제3국 이전 근거는 이 서비스의 핵심 흐름에 해당하는데
      그 사실 자체가 이용자에게 전혀 전달되지 않는다.

    applies_to: [A-01, A-02, A-03, A-04, A-05, B-01, B-02, B-03, B-04, B-05, C-01]

    remediation:
      - Art.13 요구 항목을 충족하는 privacy notice 작성
      - 수집 시점(최초 실행·입력 전)에 접근 가능한 위치에 배치
      - 국내 처리방침(제30조 제1항 각 호)과 항목 대조표 작성

    evidence:
      - privacy notice 문서 및 Art.13 항목 매핑표
      - 노출 시점·위치 스크린샷

    related: [KR-TRP-001]
    notes: |
      원문 대조 결과 Art.13이 요구하는 항목에 '수령인 또는 수령인의 범주',
      '제3국 이전 및 그 근거', '보관기간 또는 산정 기준', '감독기구 불만제기권'이
      모두 포함됨을 확인했다. 국내 제30조보다 열거가 구체적이다.

      To-Be에서 문서를 하나만 만들 경우 KR·EU 요구 항목의 합집합으로 설계하고,
      관할별로 필요한 부분만 노출하는 구조를 검토할 것.

      ★ **보관기간 항목의 판정 기준 (U-09 해소, 2026-08-11)**

      벤치마크 결과 국내 게임사 6곳의 글로벌 영문판 중 5곳이 "목적 달성에 필요한
      기간" 수준의 포괄 문구만 두고 있었다. 이를 근거로 "업계 관행이 그러하니
      이 룰의 판정 조건이 과할 수 있다"고 보았으나, **원문 확인 결과 반대였다.**

      WP260 rev.01 Annex는 그러한 포괄 서술을 명시적으로 불충분하다고 본다.
      즉 룰이 과한 것이 아니라 관행이 가이드라인 기준에 미달하는 것이다.

      → 판정 조건을 완화하지 않는다. 오히려 '언급 여부'가 아니라 '판단 가능성'
        기준으로 정밀화했다.
      → 벤치마크의 "부분기재" 판정은 유지하되, 그 의미를 "업계 표준이므로 무해"가
        아니라 "가이드라인 기준 미달이 업계 전반에 퍼져 있음"으로 해석한다.

      주의 — WP260 rev.01은 법령이 아니라 WP29가 채택하고 EDPB가 승인한 유권해석
      문서다. 구속력의 성격이 조문과 다르다는 점을 산출물에 명시할 것.

  # ────────────────────────────────────────────────────────────
  - id: EU-TRF-001
    domain: 국외이전
    title: 제3국 이전 근거 부재 및 재이전 미검토
    summary: 미국 소재 사업자로의 이전에 대한 법적 근거가 확인되지 않는다.

    legal_basis:
      - law: GDPR
        article: Art.44
        note: |
          'General principle for transfers' — Chapter V의 조건을 충족해야만 제3국·
          국제기구로 이전할 수 있으며, 이는 **제3국에서 또 다른 제3국으로의
          재이전(onward transfers)에도 적용된다**고 문언에 명시되어 있다
        verification: 확인완료
        checked_at: "2026-08-10"
        source: https://gdpr-info.eu/art-44-gdpr/
      - law: GDPR
        article: Art.45
        note: "'Transfers on the basis of an adequacy decision' — 집행위원회의 적정성 결정에 근거한 이전"
        verification: 확인완료
        checked_at: "2026-08-10"
        source: https://gdpr-info.eu/art-45-gdpr/
      - law: GDPR
        article: Art.46
        note: |
          'Transfers subject to appropriate safeguards' — Art.45(3) 결정이 없는 경우,
          적절한 안전조치와 집행 가능한 정보주체 권리·효과적 구제수단을 전제로 한 이전.
          제2항에 표준 데이터보호 조항(SCC) 등이 열거된다
        verification: 확인완료
        checked_at: "2026-08-10"
        source: https://gdpr-info.eu/art-46-gdpr/

    condition_human: |
      개인정보가 제3국으로 이전되는데
      적정성 결정·적절한 안전조치·특정 상황의 예외 중 어느 근거도 확인되지 않는 경우.
      이전받은 자가 다시 제3국으로 이전하는 경우 그 재이전 근거도 포함한다.
    check:
      scope: flows
      all_of:
        - {field: is_overseas, op: is_true}
        - {field: transfer_mechanism, op: is_null}

    severity_base: CRITICAL
    severity_rationale: |
      이전 근거 부재는 이전 자체를 위법하게 만드는 요건 결손이며,
      고지 미비처럼 사후 보완으로 치유되는 성격이 아니다.
      이전 대상이 이용자 자유 텍스트라 내용 범위를 특정할 수 없다는 점도 가중 요소다.

    applies_to: [A-01, A-02, A-03, A-04, C-01]

    remediation:
      - Google·Cloudflare·GitHub 각각의 이전 근거 확인 및 문서화
      - 데이터 처리 계약(DPA) 및 표준계약조항(SCC) 체결 여부 확인
      - 이전 경로 전체를 구간별로 도식화하고 각 구간의 근거 명시

    evidence:
      - 이전 경로 도식 및 구간별 근거 대조표
      - 각 사업자와의 DPA·SCC 사본
      - 이전 영향 검토 문서

    related: [KR-TRF-001]
    notes: |
      이 룰의 핵심은 단일 이전이 아니라 **연쇄**다.

        EU 정보주체 → 국내 서비스 → 미국 LLM 사업자

      Art.44 원문에서 Chapter V의 조건이 재이전(onward transfer)에도 적용된다고
      명시하고 있음을 확인했다. 따라서 두 번째 구간을 검토 대상에서 뺄 수 없다.

      첫 구간(EU→KR)에 대해서는 집행위원회가 한국 적정성 결정을 채택했다 —
      Commission Implementing Decision (EU) 2022/254, 2021-12-17 채택,
      GDPR Art.45(3) 근거. EUR-Lex 원문으로 확인.
      https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32022D0254

      ⚠️ **미해결 쟁점** — 한국 적정성 결정이 KR→US 재이전까지 어느 범위로
      커버하는지에 대해 교차검증 결과가 엇갈렸다.
      Codex는 "재이전을 자동 허용하지 않으며 blanket 근거로 쓸 수 없다"고 보았고,
      Gemini는 "Supplemental Rules를 통해 실질적으로 커버한다"고 보았다.
      결정문 본문과 Supplemental Rules를 직접 읽고 판단해야 하며, 그 전까지
      이 문서는 어느 쪽도 채택하지 않는다. (미확인 U-06)

      Art.35 DPIA 요건 해당 여부도 함께 검토 대상이나 영역이 달라
      다음 배치(DPA 영역)에서 다룬다.

  # ────────────────────────────────────────────────────────────
  - id: EU-RET-001
    domain: 보유·파기
    title: 보관 기간 제한 원칙 위반
    summary: 목적 달성에 필요한 기간을 넘겨 무기한 보관된다.

    legal_basis:
      - law: GDPR
        article: Art.5(1)(e)
        note: |
          'storage limitation' — 처리 목적에 필요한 기간을 넘겨 정보주체를 식별할 수
          있는 형태로 보관하지 않을 것
        verification: 확인완료
        checked_at: "2026-08-10"
        source: https://gdpr-info.eu/art-5-gdpr/
      - law: GDPR
        article: Art.5(2)
        note: |
          'accountability' — 컨트롤러는 Art.5(1) 준수에 책임을 지며
          그 준수를 입증할 수 있어야 한다
        verification: 확인완료
        checked_at: "2026-08-10"
        source: https://gdpr-info.eu/art-5-gdpr/

    condition_human: |
      개인정보의 보관 기간이 처리 목적에 필요한 범위로 제한되지 않거나,
      그 제한이 실제로 이행되고 있음을 입증할 수 없는 경우.
    check:
      scope: data_items
      any_of:
        - {field: retention.period, op: is_null}
        - {field: service.deletion_procedure, op: is_null}
        - {field: service.retention_evidence, op: is_null}

    severity_base: HIGH
    severity_rationale: |
      Art.5는 원칙 조항이며 Art.5(2)에 따라 준수 사실을 입증할 책임이 컨트롤러에게 있다.
      기간 정의와 파기 수단이 모두 없으면 입증 자체가 불가능하다.

    applies_to: [A-05, B-01, B-02, B-03, B-04, B-05]

    remediation:
      - 목적별 보유기간 산정 근거 문서화
      - 자동 파기 구현 및 실행 기록 확보
      - accountability 입증 자료 체계 수립

    evidence:
      - 보유기간 산정 근거 문서
      - 파기 구현 코드 및 테스트 결과
      - 파기 실행 기록

    related: [KR-RET-001]
    notes: |
      국내 제21조 제1항이 '보유기간 경과 시 지체 없이 파기'라는 행위 의무 중심인 데 비해
      Art.5(1)(e)는 원칙 + 입증책임(Art.5(2)) 구조다.
      To-Be에서 파기 로그를 남기는 설계는 EU 쪽 요구에서 나온다.

      ★ **EU-TRP-001과 혼동하지 말 것 (2026-08-11 정리)**

      두 룰이 겹쳐 보이지만 측정 대상이 다르다.

        EU-TRP-001 (Art.13(2)(a))  = 보관기간을 **고지**했는가        → 문서로 측정 가능
        EU-RET-001 (Art.5(1)(e))   = 실제로 필요 기간을 넘겨 **보관**하는가 → 문서로 측정 불가

      처리방침 벤치마크는 전자만 측정한다. 어떤 사업자의 처리방침에 보관기간이
      포괄적으로만 적혀 있다는 사실은 EU-TRP-001의 신호이지 EU-RET-001의 신호가
      아니다. 실제 보관 실태는 공시 문서로 알 수 없다.

      → 이 룰은 벤치마크로 캘리브레이션할 수 없다. 시스템·DB 실사가 필요하다.

  # ────────────────────────────────────────────────────────────
  - id: EU-RGT-001
    domain: 정보주체 권리
    title: 삭제권 행사 수단 부재
    summary: 정보주체가 삭제를 요구하거나 직접 삭제할 수단이 제공되지 않는다.

    legal_basis:
      - law: GDPR
        article: Art.17
        note: |
          "Right to erasure ('right to be forgotten')" — 다만 Art.17(1)의 사유와
          Art.17(3)의 예외가 있어 무조건적인 권리는 아니다
        verification: 확인완료
        checked_at: "2026-08-10"
        source: https://gdpr-info.eu/art-17-gdpr/
      - law: GDPR
        article: Art.12(2)
        note: 컨트롤러는 Arts.15-22에 따른 정보주체의 권리 행사를 용이하게 하여야 한다
        verification: 확인완료
        checked_at: "2026-08-10"
        source: https://gdpr-info.eu/art-12-gdpr/

    condition_human: |
      삭제권을 포함한 정보주체 권리를 행사할 수단이 제공되지 않거나,
      행사 방법이 안내되지 않아 사실상 행사가 불가능한 경우.
    check:
      scope: service
      any_of:
        - {field: erasure_mechanism, op: is_null}
        - {field: privacy_contact, op: is_null}

    severity_base: MEDIUM
    severity_rationale: |
      단말 저장이라는 완화 요소는 국내 룰과 동일하나,
      Art.12(2)가 '권리 행사를 용이하게 할' 적극적 의무를 부과한다는 점에서
      "이용자가 브라우저로 지울 수 있다"는 사실만으로는 충족되지 않는다.

    applies_to: [B-01, B-02, B-03, B-04, B-05]

    remediation:
      - 게임 내 데이터 삭제 기능 제공
      - privacy notice에 권리 행사 방법 및 연락 창구 명시
      - 권리 행사 요청 처리 절차 수립

    evidence:
      - 삭제 기능 구현 코드 및 테스트 결과
      - 권리 행사 절차 문서

    related: [KR-RGT-001]
    notes: |
      Art.20 데이터 이동권 해당 여부는 처리 근거에 따라 달라지므로
      처리 근거(LAW 영역) 확정 후 별도 판단한다.

  # ────────────────────────────────────────────────────────────
  - id: EU-SPC-001
    domain: 특별범주
    title: 자유 텍스트를 통한 특별범주 정보의 비의도적 처리
    summary: 통제 없는 자유 텍스트 채널이 Art.9 특별범주 정보의 유입 경로가 된다.

    legal_basis:
      - law: GDPR
        article: Art.9(1)
        note: |
          인종·민족적 출신, 정치적 견해, 종교적·철학적 신념, 노동조합 가입,
          유전자정보, 개인 식별 목적의 생체인식정보, 건강정보, 성생활·성적 지향에
          관한 개인정보의 처리를 원칙적으로 금지한다
        verification: 확인완료
        checked_at: "2026-08-10"
        source: https://gdpr-info.eu/art-9-gdpr/
      - law: GDPR
        article: Art.9(2)
        note: |
          명시적 동의, 고용·사회보장, 중대한 이익, 비영리단체의 정당한 활동,
          공개된 정보, 법적 청구, 중대한 공익, 산업보건, 공중보건,
          기록보존·연구·통계 등 Art.9(1) 금지의 예외를 열거한다
        verification: 확인완료
        checked_at: "2026-08-10"
        source: https://gdpr-info.eu/art-9-gdpr/
      - law: GDPR
        article: Art.5(1)(c)
        note: "'data minimisation' — 처리 목적에 적절하고 관련되며 필요한 범위로 제한될 것"
        verification: 확인완료
        checked_at: "2026-08-10"
        source: https://gdpr-info.eu/art-5-gdpr/

    condition_human: |
      내용이 제한되지 않는 자유 텍스트가 저장 또는 이전되는데
      특별범주 정보의 유입을 탐지·차단하는 통제가 없는 경우.
    check:
      scope: channels
      all_of:
        - {field: input_type, op: eq, value: free_text}
        - {field: special_category_filter, op: is_null}
      any_of:
        - {field: is_stored, op: is_true}
        - {field: is_transferred, op: is_true}

    severity_base: HIGH
    severity_rationale: |
      Art.9(1)은 원칙적 금지 구조이므로, 유입이 실제로 발생하면
      Art.9(2)의 예외에 해당하지 않는 한 처리 자체가 허용되지 않는다.
      의도하지 않은 수집이라는 사정이 예외 사유가 되지는 않는다.

    applies_to: [A-01, A-02, A-03, A-04, B-01]

    remediation:
      - 전송·저장 전 특별범주 탐지 계층 도입
      - 탐지 시 저장 제외 및 전송 차단 정책 적용
      - 최소수집 관점에서 자유 텍스트 보관 필요성 재검토

    evidence:
      - 탐지 모듈 구현 코드 및 테스트 케이스
      - 탐지 정확도 측정 결과
      - 보관 필요성 검토 문서

    related: [KR-SPC-001]
    notes: |
      원문 대조 결과 Art.9(1)의 열거에는 인종·민족적 출신, 유전자정보,
      개인 식별 목적의 생체인식정보가 포함된다. 국내 제23조 제1항 본문의 열거
      (사상·신념, 노동조합·정당 가입·탈퇴, 정치적 견해, 건강, 성생활 등)와
      범위가 일치하지 않는다.
      To-Be에서 항목 대조표를 작성해 탐지 대상 집합을 관할별로 정의할 것.

      Art.5(1)(c) 최소수집 관점에서는 '판정에 사용한 뒤 원문을 보관할 필요가 있는가'
      자체가 쟁점이다. 저장하지 않는 설계가 가장 강한 통제일 수 있다.

  # ────────────────────────────────────────────────────────────
  - id: EU-AGE-001
    domain: 아동
    title: 아동 동의 요건 미충족 및 연령 확인 부재
    summary: 회원국별로 다른 아동 연령 기준을 확인할 수단이 없다.

    legal_basis:
      - law: GDPR
        article: Art.8(1)
        note: |
          아동에게 직접 제공되는 정보사회서비스에서 Art.6(1)(a) 동의를 근거로 처리하는
          경우, 아동이 **16세 미만**이면 친권자 등의 동의·승인이 있어야 적법하다.
          회원국은 법으로 **최저 13세**까지 낮출 수 있다
        verification: 확인완료
        checked_at: "2026-08-10"
        source: https://gdpr-info.eu/art-8-gdpr/
      - law: GDPR
        article: Art.8(2)
        note: |
          컨트롤러는 이용 가능한 기술을 고려하여 친권자 등의 동의·승인 여부를
          확인하기 위한 합리적 노력을 하여야 한다
        verification: 확인완료
        checked_at: "2026-08-10"
        source: https://gdpr-info.eu/art-8-gdpr/

    condition_human: |
      정보사회서비스가 아동에게 제공될 수 있고 동의를 처리 근거로 삼는데
      연령 확인 수단과 친권자 동의 확인 절차가 없는 경우.
    check:
      scope: service
      all_of:
        - {field: child_access_restricted, op: is_false}
      any_of:
        - {field: age_verification, op: is_null}
        - {field: age_gate_branching, op: is_null}

    severity_base: MEDIUM
    severity_rationale: |
      국내 룰과 마찬가지로 연령을 알 수 없어 위반을 확정할 수 없는 상태다.
      다만 기준 연령이 회원국별로 갈리므로 단일 게이트로 해소되지 않는다는 점에서
      To-Be 설계 난이도는 국내보다 높다.

    applies_to: [A-01, B-01, B-04]

    remediation:
      - 회원국별 아동 연령 기준 조사표 작성 (13~16세 범위)
      - 관할 판별 후 연령 게이트를 분기하는 구조 설계
      - 친권자 동의 확인 방법 검토 — Art.8(2)의 '합리적 노력' 수준 정의

    evidence:
      - 회원국별 연령 기준 조사표
      - 연령 게이트 분기 설계 문서

    related: [KR-AGE-001]
    notes: |
      ★ 관할 축이 실제 설계를 바꾸는 대표 사례.

      원문 대조로 16세 기본·최저 13세 하향 가능을 확인했다.
      국내 만 14세 미만 기준으로 게이트를 하나 만들면 국내는 충족하지만,
      Art.8 기준(회원국에 따라 13~16세)에서는 15세 이용자가
      국내 통과·EU 미충족으로 갈린다.

      단일 연령 게이트로는 양 관할을 동시에 만족시킬 수 없으므로
      To-Be에서 관할 판별 → 기준 분기 구조가 필요하다.
