meta:
  jurisdiction: KR
  jurisdiction_name: 대한민국 — 개인정보 보호법
  version: "0.2"
  updated: "2026-08-10"
  note: |
    v0.2에서 전 조문 원문 대조 완료.

    검증 경로: 국가법령정보센터(law.go.kr)는 JS 렌더링이라 본문 추출이 되지 않아
    CaseNote(casenote.kr) 조문 페이지와 법제처 '찾기쉬운 생활법령정보'
    (easylaw.go.kr)로 대조했다. 각 legal_basis의 source가 실제로 확인한 URL이다.

    교차검증: Codex CLI로 독립 검증을 병행해 2건의 오류를 정정했다(아래).
    Gemini CLI는 WebSearch 쿼터(429)로 결과를 내지 못했다.

  corrections: |
    v0.1 -> v0.2 정정 이력

    1. 시행령 제16조 — v0.1은 '파기의 방법 및 기한'이라고 적었으나 오류.
       제16조는 파기 '방법'만 규정하며 기한 규정이 없다.
       '지체 없이'라는 기한의 근거는 법 제21조 제1항이다.
       (Codex 지적 → easylaw.go.kr 법제처 해설로 확인)

    2. 제22조의2 제1항 — v0.1은 '아동의 개인정보 처리 시 법정대리인 동의'라고
       적었으나 조건이 누락되어 오독 소지가 있었다. 모든 처리가 아니라
       '이 법에 따른 동의를 받아야 하는 경우'에 법정대리인 동의를 받고
       그 동의 여부를 확인하는 구조다.
       (Codex 지적 → casenote.kr 원문으로 확인)

    3. 제28조의8 — v0.1은 조 단위로만 인용했으나, 제1항(이전 원칙과 예외)과
       제2항(동의 시 고지사항 5개 호)으로 분리해 인용을 정밀화했다.
       이에 따라 KR-TRF-001의 개선 조치도 제2항 각 호에 맞춰 구체화했다.

rules:
  # ────────────────────────────────────────────────────────────
  - id: KR-TRP-001
    domain: 투명성
    title: 개인정보 처리방침 미수립·미공개
    summary: 개인정보를 처리하면서 처리방침을 수립·공개하지 않았다.

    legal_basis:
      - law: 개인정보 보호법
        article: 제30조 제1항
        note: 개인정보처리자는 법정 사항을 포함한 개인정보 처리방침을 정하여야 한다
        verification: 확인완료
        checked_at: "2026-08-10"
        source: https://casenote.kr/%EB%B2%95%EB%A0%B9/%EA%B0%9C%EC%9D%B8%EC%A0%95%EB%B3%B4_%EB%B3%B4%ED%98%B8%EB%B2%95/%EC%A0%9C30%EC%A1%B0
      - law: 개인정보 보호법
        article: 제30조 제2항
        note: 수립·변경 시 정보주체가 쉽게 확인할 수 있도록 대통령령으로 정하는 방법에 따라 공개하여야 한다
        verification: 확인완료
        checked_at: "2026-08-10"
        source: https://casenote.kr/%EB%B2%95%EB%A0%B9/%EA%B0%9C%EC%9D%B8%EC%A0%95%EB%B3%B4_%EB%B3%B4%ED%98%B8%EB%B2%95/%EC%A0%9C30%EC%A1%B0

    condition_human: |
      개인정보를 처리하는 서비스에 처리방침이 존재하지 않거나,
      존재하더라도 이용자가 쉽게 확인할 수 있는 방법으로 공개되어 있지 않은 경우.
    check_expr: |
      service.privacy_policy.url is None

    severity_base: HIGH
    severity_rationale: |
      처리방침은 다른 모든 고지 의무가 실려 나가는 매체다.
      부재 시 국외이전 고지·보유기간 고지·권리행사 방법 안내가 함께 불가능해지므로,
      단일 미비가 아니라 다수 의무의 선행 결손으로 본다.

    applies_to: [A-01, A-02, A-03, A-04, A-05, B-01, B-02, B-03, B-04, B-05, C-01]

    remediation:
      - 개인정보 처리방침 수립 — 제30조 제1항 각 호의 법정 기재사항 포함
      - 게임 타이틀 화면 및 최초 실행 시 상시 접근 가능한 경로 제공
      - 처리방침 개정 이력 관리 체계 수립

    evidence:
      - 게시된 처리방침 URL 및 최초 게시일
      - 제30조 제1항 각 호 기재사항 대조표
      - 서비스 내 접근 경로 스크린샷

    related: [EU-TRP-001]
    notes: |
      조 제목 확인: '개인정보 처리방침의 수립 및 공개'.

      GDPR Art.13은 국내 제30조보다 고지 항목이 구체적이다(수령인 범주, 제3국
      이전 근거, 보유기간 산정 기준, 감독기구 불만제기권 등).
      동일한 '처리방침 부재' 상태라도 To-Be에서 채워야 할 항목 수가 다르므로
      EU-TRP-001과 함께 볼 것.

  # ────────────────────────────────────────────────────────────
  - id: KR-TRF-001
    domain: 국외이전
    title: 국외 이전 고지·동의 부재
    summary: 이용자 입력을 국외 사업자에게 전송하면서 법정 이전 근거와 고지 절차가 없다.

    legal_basis:
      - law: 개인정보 보호법
        article: 제28조의8 제1항
        note: |
          국외 이전(제공·처리위탁·보관)을 원칙적으로 금지하고, 각 호에 예외를 둔다 —
          별도 동의, 법률·조약의 특별 규정, 계약 이행에 필요한 처리위탁·보관,
          인증을 받은 경우, 보호위원회의 보호수준 인정을 받은 국가·국제기구
        verification: 확인완료
        checked_at: "2026-08-10"
        source: https://casenote.kr/%EB%B2%95%EB%A0%B9/%EA%B0%9C%EC%9D%B8%EC%A0%95%EB%B3%B4_%EB%B3%B4%ED%98%B8%EB%B2%95/%EC%A0%9C28%EC%A1%B0%EC%9D%988
      - law: 개인정보 보호법
        article: 제28조의8 제2항
        note: |
          제1항 제1호에 따른 동의를 받을 때 미리 알려야 할 사항 —
          ① 이전되는 개인정보 항목 ② 이전되는 국가·시기·방법
          ③ 이전받는 자의 성명(법인은 명칭·연락처) ④ 이전받는 자의 이용목적 및
          보유·이용 기간 ⑤ 이전 거부 방법·절차 및 거부의 효과
        verification: 확인완료
        checked_at: "2026-08-10"
        source: https://casenote.kr/%EB%B2%95%EB%A0%B9/%EA%B0%9C%EC%9D%B8%EC%A0%95%EB%B3%B4_%EB%B3%B4%ED%98%B8%EB%B2%95/%EC%A0%9C28%EC%A1%B0%EC%9D%988

    condition_human: |
      개인정보가 국외로 이전되는 흐름이 존재하는데
      제28조의8 제1항 각 호의 이전 근거가 확인되지 않거나,
      동의를 근거로 하면서 제2항 각 호의 고지사항이 제공되지 않는 경우.
    check_expr: |
      any(f.destination.is_overseas for f in flows)
        and (f.transfer_ground is None
             or (f.transfer_ground == "consent"
                 and missing_items(f.disclosure, PIPA_28_8_2_REQUIRED) != []))

    severity_base: HIGH
    severity_rationale: |
      이전되는 것이 정형 필드가 아니라 이용자가 자유롭게 작성한 문장이다.
      전송 내용을 사전에 특정할 수 없어 고지 부재의 영향 범위를 한정할 수 없다.
      제1항이 국외 이전을 원칙적 금지로 두고 있어, 근거 부재는 예외 요건 미충족에
      해당한다.

    applies_to: [A-01, A-02, A-03, A-04, C-01]

    remediation:
      - 제28조의8 제1항 각 호 중 어느 근거로 이전하는지 확정
      - 제2항 각 호 5개 고지사항을 갖춘 국외 이전 현황표 작성
      - 처리방침에 국외 이전 항목 반영 및 이전 거부 방법·절차 제공
      - 시행령상 국외 이전 시 보호조치 이행 여부 확인

    evidence:
      - 국외 이전 현황표 (제2항 각 호 항목별 대조)
      - 이전 근거 확보 문서
      - 처리방침 내 국외 이전 고지 문구 및 거부 절차 화면

    related: [EU-TRF-001]
    notes: |
      조 제목 확인: '개인정보의 국외 이전'. 2023년 개정으로 신설된 조문이다.

      A-01·A-02·A-03·A-04는 Google(미국), C-01은 GitHub(미국)이다.
      C-01은 호스팅 사업자 내부 로그로 서비스 측 통제 범위 밖이나,
      이전 흐름 자체는 존재하므로 흐름표에는 남기고 통제 가능성은 별도 판단한다.

      제2항 제5호(이전 거부 방법·절차)는 To-Be 설계에 직접 영향을 준다 —
      판정을 외부 LLM에 맡기는 구조에서 '이전 거부'는 곧 기능 미제공을 뜻하므로,
      거부 시 대체 경로(로컬 판정 폴백)를 어떻게 둘지가 설계 쟁점이 된다.

  # ────────────────────────────────────────────────────────────
  - id: KR-RET-001
    domain: 보유·파기
    title: 보유기간 미정의 및 파기 절차 부재
    summary: 모든 저장 항목의 보유기간이 정의되어 있지 않고 파기 절차가 없다.

    legal_basis:
      - law: 개인정보 보호법
        article: 제21조 제1항
        note: |
          보유기간 경과·처리목적 달성·가명정보 처리기간 경과 등으로 개인정보가
          불필요하게 되었을 때에는 지체 없이 파기하여야 한다.
          다만 다른 법령에 따라 보존하여야 하는 경우는 예외
        verification: 확인완료
        checked_at: "2026-08-10"
        source: https://casenote.kr/%EB%B2%95%EB%A0%B9/%EA%B0%9C%EC%9D%B8%EC%A0%95%EB%B3%B4_%EB%B3%B4%ED%98%B8%EB%B2%95/%EC%A0%9C21%EC%A1%B0
      - law: 개인정보 보호법 시행령
        article: 제16조
        note: |
          개인정보의 파기'방법' — 전자적 파일은 복원이 불가능한 방법으로 영구 삭제,
          그 밖의 기록물·인쇄물·서면은 파쇄 또는 소각.
          ※ 파기 '기한'은 이 조문이 아니라 법 제21조 제1항의 '지체 없이'가 근거다
        verification: 확인완료
        checked_at: "2026-08-10"
        source: https://www.easylaw.go.kr/CSP/CnpClsMain.laf?csmSeq=1257&ccfNo=2&cciNo=2&cnpClsNo=3

    condition_human: |
      개인정보 항목에 보유기간이 정의되어 있지 않거나,
      보유기간이 정의되어 있어도 경과 시 파기를 실행하는 절차·수단이 없는 경우.
    check_expr: |
      item.retention_period is None or item.deletion_procedure is None

    severity_base: HIGH
    severity_rationale: |
      B-01(주문 입력 원문)이 단말에 무기한 남는다.
      보유기간 미정의는 그 자체로 미비이지만, 파기 수단까지 부재하면
      기간을 정의하더라도 이행할 방법이 없다는 점에서 구조적 결손이다.

    applies_to: [A-05, B-01, B-02, B-03, B-04, B-05]

    remediation:
      - 항목별 보유기간 정의 및 산정 근거 문서화
      - 보유기간 경과 데이터의 자동 파기 구현 — 시행령 제16조의 복원 불가능한 방법
      - 파기 실행 기록 확보 방안 수립

    evidence:
      - 항목별 보유기간 정의표
      - 파기 로직 구현 코드 및 테스트 결과
      - 파기 실행 로그 샘플

    related: [EU-RET-001]
    notes: |
      ⚠️ v0.1 정정 — 시행령 제16조를 '파기의 방법 및 기한'으로 인용했으나 오류였다.
      제16조에는 기한 규정이 없다. 기한은 법 제21조 제1항의 '지체 없이'가 근거다.
      법제처 '찾기쉬운 생활법령정보'로 확인.

      A-05(IP)는 레이트리밋용 인메모리 보관으로 성격이 다르다.
      코드상 60초 윈도우 밖은 필터되나 엔트리 자체의 잔존 시간은 확인되지 않았다
      (As-Is 문서 U-04). 보유기간 '미정의'로 분류하되 별도 확인 후 재평가한다.

  # ────────────────────────────────────────────────────────────
  - id: KR-RGT-001
    domain: 정보주체 권리
    title: 정보주체 권리행사 수단 부재
    summary: 저장된 데이터를 열람·삭제할 수단이 서비스에 없다.

    legal_basis:
      - law: 개인정보 보호법
        article: 제35조
        note: 정보주체의 개인정보 열람 요구권 및 개인정보처리자의 열람 조치 의무
        verification: 확인완료
        checked_at: "2026-08-10"
        source: https://casenote.kr/%EB%B2%95%EB%A0%B9/%EA%B0%9C%EC%9D%B8%EC%A0%95%EB%B3%B4_%EB%B3%B4%ED%98%B8%EB%B2%95/%EC%A0%9C35%EC%A1%B0
      - law: 개인정보 보호법
        article: 제36조 제1항
        note: |
          제35조에 따라 자신의 개인정보를 열람한 정보주체는 정정 또는 삭제를
          요구할 수 있다. 다만 다른 법령에서 수집 대상으로 명시된 경우 삭제 요구 제한
        verification: 확인완료
        checked_at: "2026-08-10"
        source: https://casenote.kr/%EB%B2%95%EB%A0%B9/%EA%B0%9C%EC%9D%B8%EC%A0%95%EB%B3%B4_%EB%B3%B4%ED%98%B8%EB%B2%95/%EC%A0%9C36%EC%A1%B0
      - law: 개인정보 보호법
        article: 제38조
        note: 권리행사의 방법 및 절차 — 대리 행사, 수수료, 절차 공개, 이의 제기
        verification: 확인완료
        checked_at: "2026-08-10"
        source: https://casenote.kr/%EB%B2%95%EB%A0%B9/%EA%B0%9C%EC%9D%B8%EC%A0%95%EB%B3%B4_%EB%B3%B4%ED%98%B8%EB%B2%95/%EC%A0%9C38%EC%A1%B0

    condition_human: |
      정보주체가 자신의 개인정보를 열람하거나 삭제할 수 있는 수단이
      서비스 내에 제공되지 않고, 권리행사 접수 창구도 안내되지 않는 경우.
    check_expr: |
      service.data_access_ui is None and service.privacy_contact is None

    severity_base: MEDIUM
    severity_rationale: |
      저장 위치가 이용자 단말이므로 브라우저 기능으로 삭제가 물리적으로 가능하다는
      완화 요소가 있다. 다만 그것은 이용자가 저장 사실과 키 구조를 안다는 전제이며,
      처리방침이 없어 그 사실을 알 방법이 없다(KR-TRP-001과 결합 시 실효성 소멸).
      권리행사 방법·절차 공개 의무는 저장 위치와 무관하게 별도로 성립한다.

    applies_to: [B-01, B-02, B-03, B-04, B-05]

    remediation:
      - 게임 내 저장 데이터 열람·삭제 기능 제공
      - 처리방침에 권리행사 방법 및 접수 창구 명시

    evidence:
      - 삭제 기능 구현 코드 및 동작 테스트 결과
      - 처리방침 내 권리행사 안내 문구

    related: [EU-RGT-001]
    notes: |
      As-Is 확인 결과 저장소 전체에서 localStorage.removeItem 호출이 0건이다.
      게임 내 데이터 초기화 UI도 존재하지 않는다.

      제36조의 정정·삭제 요구권은 문언상 '제35조에 따라 열람한' 정보주체를
      전제로 한다. 열람 수단이 없으면 삭제 요구의 선행 요건부터 성립하지 않는
      구조이므로, 개선은 열람 기능과 함께 설계해야 한다.

  # ────────────────────────────────────────────────────────────
  - id: KR-SPC-001
    domain: 특별범주
    title: 자유 텍스트를 통한 민감정보 비의도적 수집·국외전송
    summary: 입력 내용을 제한하지 않는 자유 텍스트 채널이 민감정보 유입 경로로 열려 있다.

    legal_basis:
      - law: 개인정보 보호법
        article: 제23조 제1항
        note: |
          민감정보(사상·신념, 노동조합·정당의 가입·탈퇴, 정치적 견해, 건강, 성생활
          등)의 처리를 원칙적으로 금지하고, 별도 동의 또는 법령의 요구·허용을
          예외로 둔다
        verification: 확인완료
        checked_at: "2026-08-10"
        source: https://casenote.kr/%EB%B2%95%EB%A0%B9/%EA%B0%9C%EC%9D%B8%EC%A0%95%EB%B3%B4_%EB%B3%B4%ED%98%B8%EB%B2%95/%EC%A0%9C23%EC%A1%B0

    condition_human: |
      이용자가 내용을 자유롭게 작성할 수 있는 입력 채널이 존재하고,
      해당 입력이 저장 또는 외부 전송되는데,
      전송·저장 전에 민감정보를 탐지하거나 차단하는 통제가 없는 경우.
    check_expr: |
      channel.input_type == "free_text"
        and (channel.is_stored or channel.is_transferred)
        and channel.pii_prefilter is None

    severity_base: HIGH
    severity_rationale: |
      제23조 제1항이 원칙적 금지 구조이므로, 유입이 실제로 발생하면
      별도 동의 등 예외 요건을 갖추지 않는 한 처리 자체가 허용되지 않는다.
      수집 의도가 없었다는 사정은 예외 사유가 되지 않는다.

      ※ 이것은 룰의 기본 심각도이며 특정 대상의 위험도가 아니다.
      실제 위험도는 유입 가능성(Likelihood)을 대상별로 평가해 산정한다 —
      자유 텍스트 채널이라도 입력 길이 제한, 입력의 목적 지향성,
      식별자 결합 여부에 따라 유입 가능성이 크게 달라진다.

    applies_to: [A-01, A-02, A-03, A-04, B-01]

    remediation:
      - 전송 전 개인정보·민감정보 탐지 및 마스킹 계층 도입
      - 탐지 시 저장 제외 정책 적용
      - 최소수집 관점에서 원문 보관 필요성 자체를 재검토

    evidence:
      - 탐지 모듈 구현 코드 및 테스트 케이스
      - 탐지·차단 동작 검증 결과

    related: [EU-SPC-001]
    notes: |
      현재 존재하는 입력 처리는 모두 개인정보 목적이 아니다.
      60자 절단은 토큰 비용, 무의미 입력 판별은 판정 품질,
      blocked 판정은 콘텐츠 안전 목적이며 판정은 전송 이후에 이루어진다.

      ★ **이 룰의 발동은 '개인정보에 해당하는가'를 먼저 통과해야 한다.**
      자유 텍스트 채널이 존재한다는 사실만으로 곧바로 위험이 성립하지 않는다.
      유입된 문자열이 제2조 제1호의 개인정보에 해당해야 하며, 특히 나목의
      **결합 용이성**(다른 정보의 입수 가능성 등을 고려)이 관건이다.

      실명으로 보이는 문자열이 유입되어도, 서비스가 결합할 다른 정보를 보유하지
      않으면 특정 개인을 알아볼 수 없어 개인정보로 보기 어렵다.
      따라서 이 룰의 실제 위험도는 **채널의 존재가 아니라 서비스가 보유한
      식별자·결합 가능 정보의 양**에 좌우된다.

      → 계정·닉네임·지속 식별자가 없는 서비스에서는 Likelihood가 낮다.
      → 계정이 도입되면 결합 용이성이 쉽게 충족되어 Likelihood가 급등한다.
      (As-Is F-005 v0.3의 식별가능성 분석 참조)

      후속 검토 — 제2조 제1호(개인정보의 정의) 및 나목의 결합 용이성 판단 기준을
      **원문으로 확인해 legal_basis에 추가할지 결정할 것.** 현재 미확인이므로
      근거 조문에 넣지 않았다.
      정보주체로부터 직접 수집하지 않은 개인정보의 고지 의무(국내 제20조,
      EU Art.14)도 별도 룰 후보이나 역시 원문 미확인이다.

      국내 민감정보(제23조)와 GDPR special categories(Art.9)는 열거 항목이 다르다.
      Art.9는 인종·민족적 출신, 유전자정보, 생체인식정보를 명시하나 제23조 제1항
      본문의 열거에는 그 표현이 없다(고유식별정보·생체인식정보는 제24조 및
      시행령에서 별도로 다뤄진다 — 확인필요).
      To-Be 단계에서 항목 대조표를 작성해 탐지 대상 집합을 관할별로 정의할 것.

  # ────────────────────────────────────────────────────────────
  - id: KR-AGE-001
    domain: 아동
    title: 연령 확인 수단 부재
    summary: 아동 이용자 여부를 판단할 수단이 없어 법정대리인 동의 요건 충족을 확인할 수 없다.

    legal_basis:
      - law: 개인정보 보호법
        article: 제22조의2 제1항
        note: |
          만 14세 미만 아동의 개인정보를 처리하기 위하여 '이 법에 따른 동의를
          받아야 할 때에는' 그 법정대리인의 동의를 받아야 하며,
          법정대리인이 동의하였는지를 확인하여야 한다
        verification: 확인완료
        checked_at: "2026-08-10"
        source: https://casenote.kr/%EB%B2%95%EB%A0%B9/%EA%B0%9C%EC%9D%B8%EC%A0%95%EB%B3%B4_%EB%B3%B4%ED%98%B8%EB%B2%95/%EC%A0%9C22%EC%A1%B0%EC%9D%982

    condition_human: |
      아동의 접근이 배제되지 않는 서비스에서, 이 법에 따른 동의를 근거로
      개인정보를 처리하면서 연령 확인 수단과 법정대리인 동의 확인 절차가 없는 경우.
    check_expr: |
      service.age_verification is None
        and service.child_access_restricted is False
        and any(f.legal_ground == "consent" for f in flows)

    severity_base: MEDIUM
    severity_rationale: |
      게임은 아동 접근 가능성이 구조적으로 높다.
      다만 As-Is는 계정이 없어 연령을 알 수 없으므로 위반 사실을 확정할 수 없고,
      '판단 불가 상태'라는 점 자체를 미비로 본다.
      To-Be에서 계정과 동의 절차가 도입되면 심각도가 상향될 항목이다.

    applies_to: [A-01, B-01, B-04]

    remediation:
      - 연령 확인 절차 설계
      - 만 14세 미만 식별 시 법정대리인 동의 및 동의 여부 확인 절차 적용
      - 아동 대상 고지문 별도 작성

    evidence:
      - 연령 확인 플로우 설계 문서
      - 법정대리인 동의 확인 절차 구현 결과

    related: [EU-AGE-001]
    notes: |
      ⚠️ v0.1 정정 — '아동의 개인정보 처리 시 법정대리인 동의'로 요약했으나
      조건이 빠져 오독 소지가 있었다. 모든 처리에 법정대리인 동의가 필요한 것이
      아니라, '이 법에 따라 동의를 받아야 하는 경우'에 한한다.
      이에 따라 check_expr에도 동의를 처리근거로 삼는 흐름이 있을 것이라는
      조건을 추가했다.

      국내는 만 14세 미만 기준이나 GDPR Art.8은 16세를 기본으로 하고
      회원국이 13세까지 하향할 수 있다. 즉 단일 연령 게이트로는 양 관할을 동시에
      만족시킬 수 없다. To-Be에서 관할 분기가 실제 설계를 바꾸는 대표 지점이다.
