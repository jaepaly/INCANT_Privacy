meta:
  service_id: incant-tobe
  service_name: INCANT (상용화 가정)
  version: "0.1"
  updated: "2026-08-11"
  basis:
    - docs/to-be/02_service_model.md
    - docs/to-be/01_policy_benchmark.md
  note: |
    To-Be 인벤토리. 가정에 기반하되 근거 있는 가정만 쓴다.
    법정 보존기간은 원문 확인 여부를 retention.verified로 구분한다.
    verified: false인 항목은 근거로 삼기 전에 원문 확인이 필요하다.

# ─────────────────────────────────────────────────────────────
# 서비스 수준 속성 — 룰의 service.* 참조 대상
# ─────────────────────────────────────────────────────────────
service:
  jurisdictions: [KR, EU]
  privacy_policy_url: null          # 미수립 — To-Be 설계 대상
  privacy_notice_eu: null
  privacy_contact: null
  data_access_ui: null
  erasure_mechanism: null
  age_verification: null
  child_access_restricted: false
  age_gate_branching: null          # 관할별 분기 (§5.3에서 채택 결정, 미구현)
  deletion_procedure: null          # 보유기간 경과 데이터의 자동 파기 — 미구현
  retention_evidence: null          # 파기 실행 기록 — GDPR Art.5(2) 입증책임 대응

# ─────────────────────────────────────────────────────────────
systems:
  - {id: SYS-01, name: 게임 클라이언트, location: 이용자 단말, country: KR}
  - {id: SYS-02, name: 게임 서버, location: 클라우드, country: KR}
  - {id: SYS-03, name: 회원 DB, location: 클라우드, country: KR}
  - {id: SYS-04, name: 판정 게이트웨이, location: 클라우드, country: KR}
  - {id: SYS-05, name: 결제 서버, location: 클라우드, country: KR}
  - {id: SYS-06, name: 로그 저장소, location: 클라우드, country: KR}
  - {id: SYS-07, name: 분석 시스템, location: 클라우드 + 외부 SaaS, country: KR/US}
  - {id: SYS-08, name: 고객센터, location: 외부 SaaS, country: US}
  - {id: SYS-09, name: 발송 시스템, location: 외부 SaaS, country: KR/DE}

# ─────────────────────────────────────────────────────────────
# 수탁자·외부 사업자 — 유형과 사업자는 벤치마크 관찰 기반
# ─────────────────────────────────────────────────────────────
vendors:
  - id: V-01
    name: AWS
    relation: 위탁
    task: 클라우드 인프라 운영
    country: KR
    is_overseas: false
    dpa: null
    note: 국외 백업 구성 시 조건부 국외이전 발생
  - id: V-02
    name: Google (Gemini API)
    relation: 미확정            # ★ 위탁 vs 제3자 제공 — 서비스 모델 §5.1
    task: 주문 텍스트 의미 판정
    country: US
    is_overseas: true
    dpa: null
    note: |
      relation 확정의 선행 조건은 U-01(입력 보관·학습 이용 정책).
      확인 전까지 어느 쪽도 확정하지 않는다.
  - id: V-03
    name: 코리아크레딧뷰로
    relation: 위탁
    task: 본인확인·연령확인
    country: KR
    is_overseas: false
    dpa: null
  - id: V-04
    name: KG이니시스
    relation: 위탁
    task: 결제 대행
    country: KR
    is_overseas: false
    dpa: null
  - id: V-05
    name: Zendesk
    relation: 위탁
    task: 고객문의 접수·처리
    country: US
    is_overseas: true
    dpa: null
  - id: V-06
    name: Infobip
    relation: 위탁
    task: SMS·이메일 발송
    country: DE
    is_overseas: true
    dpa: null
  - id: V-07
    name: Google Analytics 4
    relation: 위탁
    task: 이용 통계 분석
    country: US
    is_overseas: true
    dpa: null
  - id: V-08
    name: BattlEye
    relation: 위탁
    task: 부정이용 탐지
    country: DE
    is_overseas: true
    dpa: null

# ─────────────────────────────────────────────────────────────
# 자유 입력 채널 — 룰의 channel.* 참조 대상
# ─────────────────────────────────────────────────────────────
channels:
  - id: CH-01
    name: 주문 입력창
    input_type: free_text
    max_length: 60
    is_stored: false            # §5.4 원문 미보관 채택
    is_transferred: true        # V-02로 국외 전송
    pii_prefilter: null         # 미구현 — F-005 통제 대상
    special_category_filter: null
  - id: CH-02
    name: 고객센터 문의
    input_type: free_text
    max_length: null
    is_stored: true
    is_transferred: true        # V-05로 국외 전송
    pii_prefilter: null
    special_category_filter: null
  - id: CH-03
    name: 문의 첨부파일
    input_type: file
    is_stored: true
    is_transferred: true
    pii_prefilter: null
    special_category_filter: null

