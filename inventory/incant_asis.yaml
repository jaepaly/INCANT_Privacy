meta:
  service_id: incant-asis
  service_name: INCANT (실제 배포 데모)
  version: "0.1"
  updated: "2026-08-11"
  pinned_commit: 852bbd544133f840d972cfc667d17a16618d10db
  basis:
    - docs/as-is/01_data_flow_asis.md
  note: |
    As-Is 인벤토리. **룰 엔진 입력 전용 데이터**다.

    사람이 읽는 As-Is 기술은 docs/as-is/01_data_flow_asis.md가 정본이며,
    거기에는 코드 permalink 근거가 붙어 있다. 이 파일은 그 문서를 룰이 평가할 수
    있는 형태로 옮긴 것이므로 **문서로 생성하지 않는다**(중복은 곧 어긋남이다).

    항목 ID는 흐름표와 동일하게 유지해 상호 참조가 가능하다.

